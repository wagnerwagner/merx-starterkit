# This blueprint is a container for a product with different variants. (e.g. a jeans with different sizes)

title:
  en: Product (with Variants)
  de: Produkt (mit Varianten)

navigation:
  template:
    - product
    - product-variants

image:
  query: page.thumb.toFile
  cover: true

fields:
  variants:
    type: pagelist
    templates: product-variant
    text: "{{ page.variantName }}"
    layout: table
    image: false
    columns:
      price:
        label: field.price
        value: '{{ page.price }}'
      stock:
        label: field.stock
        value: '{{ page.stock ?? "∞" }}'

  blocks:
    type: blocks
    width: 2/3
  defaultVariant:
    label:
      en: Default Variant
      de: Standard-Variante
    type: pages
    text: "{{ page.variantName }}"
    info: "{{ page.price }}, {{ kirby.translation.get('field.stock') }}: {{ page.stock }}"
    translate: false
    multiple: false
    query: page.variants
    width: 1/3
