title: page.title.product
navigation:
  template:
    - product
    - product-variants

image:
  query: page.thumb.toFile
  cover: true

tabs:
  content:
    columns:
      -
        width: 2/3
        fields:
          price:
            type: prices
            width: 1/2
          taxRule:
            type: taxrules
            width: 1/2
          stock:
            label:
              en: Stock
              de: Verfügbare Produkte
            type: number
            placeholder:
              en: infinite
              de: unendlich
            translate: false
            width: 1/2
          blocks:
            type: blocks
      -
        width: 1/3
        fields:
          thumb:
            type: files
            multiple: false
            layout: cards
            query: page.images
            require: true
            width: 1/3
            image:
              ratio: 6/4
            translate: false

  orders:
    extends: wagnerwagner.merx.tabs/orders
