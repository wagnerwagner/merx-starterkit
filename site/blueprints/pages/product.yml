title: page.title.product
navigation:
  template:
    - product
    - product-variants

image:
  query: page.thumb.toFile
  cover: true

fields:
  price:
    extends: fields/price
    width: 5/12
  taxRule:
    extends: fields/tax-rule
    width: 4/12
  stock:
    extends: fields/stock
    width: 3/12
  blocks:
    type: blocks
  thumb:
    type: files
    multiple: false
    layout: cards
    query: page.images
    require: true
    width: 1/3
    image:
      ratio: 6/4
    translate: false

tabs:
  content:
    icon: draft
    columns:
      -
        width: 8/12
        fields:
          - price
          - taxRule
          - stock
          - blocks
      -
        width: 4/12
        fields:
          - thumb

  orders:
    icon: list-numbers
    fields:
      orders:
        extends: fields/orders
        query: page.orders
        # What the order holds of this product, see `ProductPage::orders()`
        columns:
          quantity:
            label: field.quantity
          price:
            label: field.price
          producttotal:
            label: field.total
