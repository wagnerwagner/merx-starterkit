# The checkout validates an order against these fields, and the checkout
# template builds its form from them.
# See /site/controllers/checkout.php for more information.

type: group
fields:
  email:
    label:
      en: Email
      de: E-Mail
    type: email
    default: mail@example.com
    required: true
    translate: false
  name:
    label:
      en: Name
      de: Name
    type: text
    default: Marta Doe
    required: true
    translate: false
    minlength: 3
    maxlength: 160
  organization:
    label:
      en: Organization
      de: Organisation
    type: text
    translate: false
    maxlength: 160
  streetAddress:
    label:
      en: Street
      de: Straße
    type: text
    default: Milkyway 1
    required: true
    translate: false
    minlength: 3
    maxlength: 160
  postalCode:
    label:
      en: Postal Code
      de: PLZ
    type: text
    default: 12345
    width: 1/3
    required: true
    translate: false
  city:
    label:
      en: City
      de: Stadt
    type: text
    default: Ducktown
    width: 2/3
    required: true
    translate: false
    minlength: 3
    maxlength: 160
  country: # ISO 3166
    label:
      en: Country
      de: Land
    type: text
    default: DE
    placeholder:
      en: US
      de: DE
    required: true
    minlength: 2
    maxlength: 2
    validate:
      alpha: true
    translate: false
  headlineShipping:
    type: headline
    label:
      en: Shipping
      de: Versand
    numbered: false
  billingAddressIsShippingAddress:
    default: 'true'
    label:
      en: Use billing address as shipping address
      de: Rechungsadresse als Versandadresse verwenden
    type: toggle
    text:
      -
        en: "No"
        de: Nein
      -
        en: "Yes"
        de: Ja
    translate: false
  shippingName:
    label: Name
    type: text
    required: true
    translate: false
    when:
      billingAddressIsShippingAddress: false
  shippingOrganization:
    label:
      en: Organization
      de: Organisation
    type: text
    translate: false
    when:
      billingAddressIsShippingAddress: false
  shippingStreetAddress:
    label:
      en: Street
      de: Straße
    type: text
    required: true
    translate: false
    when:
      billingAddressIsShippingAddress: false
  shippingPostalCode:
    label:
      en: Postal Code
      de: PLZ
    type: text
    required: true
    width: 1/3
    translate: false
    when:
      billingAddressIsShippingAddress: false
  shippingCity:
    label:
      en: City
      de: Stadt
    type: text
    required: true
    width: 2/3
    translate: false
    when:
      billingAddressIsShippingAddress: false
  shippingCountry:
    label:
      en: Country
      de: Land
    type: text
    required: true
    placeholder:
      en: US
      de: DE
    translate: false
    when:
      billingAddressIsShippingAddress: false
