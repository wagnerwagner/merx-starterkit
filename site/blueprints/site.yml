tabs:
  pages:
    icon: page
    label:
      en: Pages
      de: Seiten
    fields:
      homepage:
        label:
          en: Homepage
          de: Startseite
        type: pagelist
        template: home
      pages:
        label:
          en: Pages
          de: Seiten
        type: pagelist
        template:
          - default
          - product
          - product-variants
        info: "{{ page.intendedTemplate.name }}"
      errorPage:
        label:
          en: Error Page
          de: Fehler-Seite
        type: pagelist
        template: error
  orders:
    icon: draft
    label:
      en: Orders
      de: Bestellungen
    fields:
      orders:
        extends: fields/orderslist
        parent: site.ordersPage
        flip: true
